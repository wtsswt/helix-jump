<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>螺旋坠落 · Helix Drop</title>
<meta name="description" content="转动螺旋塔，让一直弹跳的小球穿过缺口一路坠落。">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --bg: #0a0510;
    --ink: #fff3f6;
    --dim: #b9a3ae;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  #stage { position: fixed; inset: 0; overflow: hidden; }

  canvas#game {
    display: block;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: grab;
  }
  canvas#game.dragging { cursor: grabbing; }

  /* ---------------- HUD ---------------- */
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: max(14px, env(safe-area-inset-top)) clamp(14px, 4vw, 24px) 0;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    pointer-events: none;
    user-select: none;
  }

  #score {
    font-size: clamp(30px, 9vw, 46px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.02em;
    text-shadow: 0 2px 18px rgba(255,63,99,0.35);
    font-variant-numeric: tabular-nums;
  }

  .stat-row {
    display: flex;
    gap: 10px;
    margin-top: 6px;
    font-size: clamp(11px, 3.1vw, 13px);
    color: var(--dim);
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
  }
  .stat-row b { color: var(--ink); font-weight: 600; }

  .hud-actions { display: flex; gap: 10px; pointer-events: auto; }

  .icon-btn {
    width: 44px; height: 44px; min-width: 44px;
    border: 1px solid rgba(255,255,255,0.16);
    background: rgba(24,10,18,0.55);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border-radius: 14px;
    color: var(--ink);
    display: grid;
    place-items: center;
    padding: 0;
    cursor: pointer;
    transition: background .18s ease, border-color .18s ease, transform .12s ease;
  }
  .icon-btn:hover { background: rgba(40,16,28,0.72); border-color: rgba(255,255,255,0.28); }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn svg { width: 20px; height: 20px; display: block; fill: currentColor; }
  .icon-btn.off { color: #7d6b74; }

  /* ---------------- 状态浮标 ---------------- */
  #floaters {
    position: absolute;
    left: 0; right: 0; top: 22%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    pointer-events: none;
  }

  .floater {
    font-size: clamp(15px, 4.4vw, 20px);
    font-weight: 800;
    letter-spacing: 0.06em;
    padding: 5px 16px;
    border-radius: 999px;
    background: rgba(12,4,10,0.66);
    border: 1px solid rgba(255,255,255,0.14);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    animation: floatUp 1s cubic-bezier(.2,.8,.3,1) forwards;
    white-space: nowrap;
  }
  .floater.hot {
    color: #ffd166;
    border-color: rgba(255,209,102,0.45);
    box-shadow: 0 0 24px rgba(255,140,60,0.3);
  }

  @keyframes floatUp {
    0%   { opacity: 0; transform: translateY(14px) scale(0.9); }
    22%  { opacity: 1; transform: translateY(0) scale(1); }
    70%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(-26px) scale(1); }
  }

  /* ---------------- 面板 ---------------- */
  .panel {
    position: absolute;
    inset: 0;
    display: none;
    place-items: center;
    padding: clamp(18px, 5vw, 32px);
    background: radial-gradient(120% 80% at 50% 40%, rgba(20,7,16,0.62), rgba(5,2,6,0.94));
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
    z-index: 5;
  }
  .panel.show { display: grid; }

  .card { width: 100%; max-width: 380px; text-align: center; }

  .eyebrow {
    font-size: clamp(10px, 2.9vw, 12px);
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #8d7480;
    margin: 0 0 10px;
  }

  .title {
    margin: 0 0 6px;
    font-size: clamp(30px, 9.6vw, 42px);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.08;
    background: linear-gradient(150deg, #fff 10%, #ff8fa1 55%, #ff3f63 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .title.sm { font-size: clamp(26px, 8vw, 36px); }

  .subtitle {
    margin: 0 0 22px;
    font-size: clamp(13px, 3.7vw, 15px);
    line-height: 1.7;
    color: #c6b0ba;
  }

  .rules {
    margin: 0 0 24px;
    padding: 0;
    list-style: none;
    text-align: left;
    display: grid;
    gap: 11px;
  }
  .rules li {
    display: grid;
    grid-template-columns: 26px 1fr;
    gap: 10px;
    align-items: start;
    font-size: clamp(12.5px, 3.5vw, 14px);
    line-height: 1.6;
    color: #cdb8c2;
  }
  .rules b { color: #fff; font-weight: 700; }
  .k {
    width: 26px; height: 26px;
    display: grid;
    place-items: center;
  }
  .k svg { width: 22px; height: 22px; display: block; }

  .btn-main {
    width: 100%;
    min-height: 52px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, #ff5c78, #e01e46);
    color: #fff;
    font-size: clamp(15px, 4.2vw, 17px);
    font-weight: 700;
    letter-spacing: 0.04em;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(224,30,70,0.35);
    transition: transform .12s ease, box-shadow .18s ease;
    font-family: inherit;
  }
  .btn-main:hover { box-shadow: 0 12px 36px rgba(224,30,70,0.48); }
  .btn-main:active { transform: translateY(1px) scale(0.99); }

  .result-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 0 0 24px;
  }
  .result-grid div {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 14px;
    padding: 14px 8px;
  }
  .result-grid b {
    display: block;
    font-size: clamp(20px, 6vw, 26px);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .result-grid span {
    display: block;
    margin-top: 4px;
    font-size: clamp(10px, 2.9vw, 11.5px);
    color: #9a828d;
    letter-spacing: 0.08em;
  }
  .result-grid .hi b { color: #ffd166; }

  .new-best {
    display: none;
    margin: 0 0 16px;
    font-size: clamp(12px, 3.4vw, 14px);
    font-weight: 700;
    letter-spacing: 0.1em;
    color: #ffd166;
  }
  .new-best.show { display: block; }

  .sign {
    position: absolute;
    left: 50%;
    bottom: max(8px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    margin: 0;
    font-size: 11px;
    letter-spacing: 0.03em;
    color: #8a7580;
    z-index: 3;
    pointer-events: none;
    white-space: nowrap;
  }

  @media (max-width: 360px) {
    .result-grid { gap: 8px; }
    .result-grid div { padding: 12px 4px; }
  }

  @media (min-width: 768px) {
    #score { font-size: clamp(38px, 4.4vw, 52px); }
    .card { max-width: 420px; }
  }

  @media (min-width: 1024px) {
    #hud { padding: max(22px, env(safe-area-inset-top)) clamp(24px, 3vw, 40px) 0; }
    .card { max-width: 440px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<div id="stage">
  <canvas id="game" aria-label="螺旋坠落游戏画面"></canvas>

  <div id="hud">
    <div class="stat">
      <div id="score">0</div>
      <div class="stat-row">
        <span>深度 <b id="depth">0</b></span>
        <span>最高 <b id="best">0</b></span>
      </div>
    </div>
    <div class="hud-actions">
      <button class="icon-btn" id="btnSound" type="button" aria-label="关闭音效" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
      </button>
      <button class="icon-btn" id="btnPause" type="button" aria-label="暂停">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
      </button>
    </div>
  </div>

  <div id="floaters" aria-live="polite"></div>

  <p class="sign">© 2026 swt · AI 辅助生成</p>

  <div class="panel show" id="panelStart">
    <div class="card">
      <p class="eyebrow">Helix Drop</p>
      <h1 class="title">螺旋坠落</h1>
      <p class="subtitle">小球自己在弹。你能做的只有转塔。</p>
      <ul class="rules">
        <li>
          <span class="k"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18M3 12l4-4M3 12l4 4M21 12l-4-4M21 12l-4 4" fill="none" stroke="#ffb3bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span>左右拖动，或按 <b>←</b> <b>→</b> 转动塔身</span>
        </li>
        <li>
          <span class="k"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="#e8364f" stroke-width="6" stroke-dasharray="36 14" transform="rotate(-52 12 12)"/></svg></span>
          <span>缺口转到球下，球就掉下一层，那一层随之碎裂</span>
        </li>
        <li>
          <span class="k"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="#0b0004" stroke="#ff2d55" stroke-width="2.6" stroke-dasharray="3 2.2"/></svg></span>
          <span>黑色带锯齿的扇区，球落上去就碎</span>
        </li>
        <li>
          <span class="k"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="#ff8b1f"/><circle cx="12" cy="12" r="3.4" fill="#fff3c4"/></svg></span>
          <span>连续穿透三层，球会燃起来，下一层直接砸穿</span>
        </li>
      </ul>
      <button class="btn-main" id="btnStart" type="button">开始坠落</button>
    </div>
  </div>

  <div class="panel" id="panelPause">
    <div class="card">
      <p class="eyebrow">Paused</p>
      <h1 class="title sm">暂停</h1>
      <p class="subtitle">球停在半空，节奏也停了。</p>
      <button class="btn-main" id="btnResume" type="button">继续</button>
    </div>
  </div>

  <div class="panel" id="panelOver">
    <div class="card">
      <p class="eyebrow">Run Over</p>
      <h1 class="title sm">球碎了</h1>
      <p class="new-best" id="newBest">新纪录</p>
      <div class="result-grid">
        <div><b id="ovScore">0</b><span>得分</span></div>
        <div><b id="ovDepth">0</b><span>深度</span></div>
        <div class="hi"><b id="ovBest">0</b><span>最高</span></div>
      </div>
      <button class="btn-main" id="btnAgain" type="button">再来一次</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var TAU = Math.PI * 2;
  var BALL_A = 0;                     // 球固定停在轨道的这个角度（世界坐标）

  var CFG = {
    R: 1.0,            // 盘外半径
    INNER: 0.17,       // 盘内孔半径（中心柱）
    GAP: 0.84,         // 层间距
    THICK: 0.062,      // 盘厚
    BALL_R: 0.13,      // 球半径
    ORBIT: 0.76,       // 球所在轨道半径
    TILT: 0.26,        // 俯视压扁系数
    GRAV: -15.0,       // 重力
    VMAX: -8.5,        // 终端速度
    BOUNCE_H: 0.32,    // 每次弹起的高度（球自己一直弹）
    SPIN: 2.5,         // 键盘转速 rad/s
    DRAG: 0.0058,      // 拖动灵敏度 rad/px
    GAP_W0: 1.34,      // 起始缺口角宽
    GAP_W_MIN: 0.74    // 最窄缺口角宽
  };
  CFG.BOUNCE_V = Math.sqrt(2 * Math.abs(CFG.GRAV) * CFG.BOUNCE_H);
  var BALL_ANG = Math.asin(CFG.BALL_R / CFG.ORBIT);   // 球占据的角半径

  var view = { W: 0, H: 0, cx: 0, baseY: 0, scale: 1, dpr: 1 };

  var S = {
    mode: 'ready',            // ready | play | pause | over
    rot: 0, rotV: 0,
    ballY: 1.9, vy: 0,
    camY: 0,
    layers: [], nextIdx: 0,
    score: 0, depth: 0, best: 0,
    combo: 0, fireball: false,
    squash: 0, bounceTick: 0,
    shake: 0, t: 0, deadT: 0,
    warnLayer: null, warnHot: false, warnPulse: 0,
    soundOn: true
  };

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var elScore = document.getElementById('score');
  var elDepth = document.getElementById('depth');
  var elBest = document.getElementById('best');
  var elFloaters = document.getElementById('floaters');
  var panelStart = document.getElementById('panelStart');
  var panelPause = document.getElementById('panelPause');
  var panelOver = document.getElementById('panelOver');
  var btnSound = document.getElementById('btnSound');
  var btnPause = document.getElementById('btnPause');
  var ovScore = document.getElementById('ovScore');
  var ovDepth = document.getElementById('ovDepth');
  var ovBest = document.getElementById('ovBest');
  var elNewBest = document.getElementById('newBest');

  function norm(a) {
    a = a % TAU;
    return a < 0 ? a + TAU : a;
  }
  function angDiff(a, b) {
    var d = (a - b) % TAU;
    if (d > Math.PI) d -= TAU;
    if (d < -Math.PI) d += TAU;
    return d;
  }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function rand(a, b) { return a + Math.random() * (b - a); }

  // 世界点 = (r·cosθ, y, r·sinθ)，俯视压扁 TILT
  function projX(a, r) {
    return view.cx + r * Math.cos(a) * view.scale;
  }
  function projY(a, r, y) {
    return view.baseY + (S.camY - y) * view.scale + r * Math.sin(a) * CFG.TILT * view.scale;
  }
  function layerCY(y) {
    return view.baseY + (S.camY - y) * view.scale;
  }

  // =====================================================================
  //  音效
  // =====================================================================
  var AC = null;

  function audio() {
    if (!S.soundOn) return null;
    if (!AC) {
      try {
        var Ctor = window.AudioContext || window.webkitAudioContext;
        if (!Ctor) return null;
        AC = new Ctor();
      } catch (e) { return null; }
    }
    if (AC.state === 'suspended') { try { AC.resume(); } catch (e) {} }
    return AC;
  }

  function tone(freq, dur, type, vol, slideTo) {
    var ac = audio();
    if (!ac) return;
    var t0 = ac.currentTime;
    var o = ac.createOscillator();
    var g = ac.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(40, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g);
    g.connect(ac.destination);
    o.start(t0);
    o.stop(t0 + dur + 0.03);
  }

  function noiseBurst(dur, vol, hp) {
    var ac = audio();
    if (!ac) return;
    var t0 = ac.currentTime;
    var len = Math.floor(ac.sampleRate * dur);
    var buf = ac.createBuffer(1, len, ac.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < len; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.2);
    }
    var src = ac.createBufferSource();
    src.buffer = buf;
    var f = ac.createBiquadFilter();
    f.type = 'highpass';
    f.frequency.value = hp || 700;
    var g = ac.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(ac.destination);
    src.start(t0);
  }

  function sfxBounce(n) {
    var f = 300 + (n % 4) * 46;
    tone(f, 0.09, 'sine', 0.1, f * 0.55);
  }
  function sfxDrop(combo) {
    var f = 420 + Math.min(combo, 8) * 55;
    tone(f, 0.13, 'triangle', 0.12, f * 1.85);
    noiseBurst(0.11, 0.05, 1600);
  }
  function sfxSmash() {
    tone(180, 0.22, 'sawtooth', 0.14, 55);
    noiseBurst(0.26, 0.12, 420);
  }
  function sfxIgnite() {
    tone(520, 0.26, 'sine', 0.09, 980);
    tone(780, 0.22, 'triangle', 0.06, 1400);
  }
  function sfxDie() {
    tone(260, 0.5, 'sawtooth', 0.15, 62);
    noiseBurst(0.45, 0.15, 260);
  }

  // =====================================================================
  //  塔的生成
  // =====================================================================
  function makeLayer(i, y, prev) {
    var gap;
    if (!prev) {
      gap = BALL_A + 1.15;                       // 开局缺口偏开球，先让玩家转一次
    } else {
      var dir = Math.random() < 0.5 ? -1 : 1;
      var step = rand(0.55, 2.35);
      gap = prev.gap + dir * step;
      if (Math.abs(angDiff(gap, BALL_A)) > 2.30) gap = prev.gap - dir * step;
      if (Math.abs(angDiff(gap, BALL_A)) > 2.45) gap = BALL_A + rand(-2.0, 2.0);
    }
    gap = norm(gap);

    var gapW = Math.max(CFG.GAP_W_MIN, CFG.GAP_W0 - i * 0.0055);

    // 危险扇区只占盘的一小段，缺口本身永远留空
    var hz = [];
    var count = 0;
    if (i >= 1 && Math.random() < Math.min(0.78, i * 0.062)) count++;
    if (i >= 12 && Math.random() < Math.min(0.45, (i - 11) * 0.045)) count++;
    if (i >= 30 && Math.random() < 0.26) count++;

    // 缺口两侧各留一段纯红缓冲带，落偏了还有得救
    var freeA = gapW * 0.5 + 0.58;
    var freeB = TAU - gapW * 0.5 - 0.58;

    for (var k = 0; k < count; k++) {
      var w = rand(0.42, 0.86);
      if (freeB - freeA - w < 0.2) break;
      var placed = null;
      for (var tr = 0; tr < 12; tr++) {
        var c = norm(gap + freeA + w * 0.5 + Math.random() * (freeB - freeA - w));
        var ok = true;
        for (var m = 0; m < hz.length; m++) {
          if (Math.abs(angDiff(c, hz[m].c)) < (w + hz[m].w) * 0.5 + 0.30) { ok = false; break; }
        }
        if (ok) { placed = { c: c, w: w }; break; }
      }
      if (placed) hz.push(placed);
    }

    return {
      i: i, y: y,
      gap: gap, gapW: gapW,
      hz: hz,
      broken: false,
      sink: 0
    };
  }

  // 球下方最高的两层（standing = 球站在上面那层，second = 它下面一层）
  function layersBelow() {
    var top = null, second = null;
    for (var n = 0; n < S.layers.length; n++) {
      var L = S.layers[n];
      if (L.broken) continue;
      if (L.y <= S.ballY + 0.002) {
        if (!top || L.y > top.y) { second = top; top = L; }
        else if (!second || L.y > second.y) { second = L; }
      }
    }
    return { top: top, second: second };
  }

  // 球正下方最近的一层（球下一次要落到的盘）
  function layerUnderBall() {
    return layersBelow().top;
  }

  // 预警目标：球接下来真的会落到哪一层
  // 还站在本层上且缺口没对准 → 会落回本层；缺口已对准 → 会掉到下面那层
  function warnTarget() {
    var b = layersBelow();
    if (!b.top) return null;
    var standing = (S.ballY - CFG.BALL_R - b.top.y) < 0.012;
    if (standing && canPass(b.top)) return b.second || b.top;
    return b.top;
  }

  function ensureLayers() {
    var last = S.layers.length ? S.layers[S.layers.length - 1] : null;
    var guard = 0;
    while ((!last || last.y > S.ballY - 8 * CFG.GAP) && guard++ < 40) {
      var i = S.nextIdx++;
      var y = -i * CFG.GAP;
      var L = makeLayer(i, y, last);
      S.layers.push(L);
      last = L;
    }
    while (S.layers.length > 90) S.layers.shift();
  }

  // =====================================================================
  //  判定
  // =====================================================================
  function canPass(L) {
    // 球心落在缺口窗口内才算通过；留一点宽容，差半度不至于撞死
    var win = L.gapW * 0.5 - BALL_ANG * 0.58;
    return Math.abs(angDiff(BALL_A, L.gap + S.rot)) < win;
  }

  function onHazard(L) {
    for (var n = 0; n < L.hz.length; n++) {
      var h = L.hz[n];
      // 球边缘擦到不算，要明显压上去
      if (Math.abs(angDiff(BALL_A, h.c + S.rot)) < h.w * 0.5 - BALL_ANG * 0.45) return true;
    }
    return false;
  }

  // =====================================================================
  //  物理
  // =====================================================================
  function collideDown(prevBottom, bottom) {
    for (var n = 0; n < S.layers.length; n++) {
      var L = S.layers[n];
      if (L.broken) continue;
      if (prevBottom > L.y && bottom <= L.y) {
        if (S.fireball) { smashThrough(L); return; }
        if (canPass(L)) { dropThrough(L); return; }
        if (onHazard(L)) { die(); return; }
        bounceOn(L);
        return;
      }
    }
  }

  function bounceOn(L) {
    S.ballY = L.y + CFG.BALL_R + 0.0004;
    S.vy = CFG.BOUNCE_V;      // 球永远自己弹，不落地不起身
    S.combo = 0;
    S.fireball = false;
    S.bounceTick++;
    L.sink = 1;
    S.squash = 1;
    sfxBounce(S.bounceTick);
    burst(projX(BALL_A, CFG.ORBIT), projY(BALL_A, CFG.ORBIT, L.y),
          4, ['#ffb3c1', '#ff6b8a'], 1.4, 'dot');
  }

  function dropThrough(L) {
    L.broken = true;
    S.combo++;
    S.score += 10 + (S.combo - 1) * 6;
    if (L.i + 1 > S.depth) S.depth = L.i + 1;

    shatter(L, false);
    sfxDrop(S.combo);

    if (S.combo >= 2) floater('连穿 ×' + S.combo, false);

    if (S.combo >= 3 && !S.fireball) {
      S.fireball = true;
      floater('燃起来了 · 下一层砸穿', true);
      sfxIgnite();
      S.shake = Math.max(S.shake, 6);
    }
    updateHud();
  }

  function smashThrough(L) {
    L.broken = true;
    S.combo = 0;
    S.fireball = false;
    S.score += 24;
    if (L.i + 1 > S.depth) S.depth = L.i + 1;

    shatter(L, true);
    sfxSmash();
    S.shake = Math.max(S.shake, 11);
    floater('砸穿 +24', true);
    updateHud();
  }

  function die() {
    if (S.mode !== 'play') return;
    S.mode = 'over';
    S.deadT = 0;
    S.shake = 14;
    S.fireball = false;
    sfxDie();

    var sx = projX(BALL_A, CFG.ORBIT);
    var sy = projY(BALL_A, CFG.ORBIT, S.ballY);
    burst(sx, sy, 26, ['#9fe4ff', '#4bb4e8', '#ffffff'], 5.5, 'dot');
    burst(sx, sy, 10, ['#7fd4ff', '#c8f2ff'], 3.2, 'shard');

    if (S.score > S.best) {
      S.best = S.score;
      try { localStorage.setItem('helix-drop-best', String(S.best)); } catch (e) {}
      elNewBest.classList.add('show');
    } else {
      elNewBest.classList.remove('show');
    }
    elBest.textContent = S.best;
  }

  // =====================================================================
  //  粒子
  // =====================================================================
  var PARTS = [];

  function burst(x, y, n, colors, speed, kind) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * TAU;
      var sp = speed * rand(0.4, 1.15) * Math.max(0.55, view.scale / 170);
      PARTS.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp * 0.85 - sp * 0.35,
        g: 900 + Math.random() * 700,
        life: rand(0.4, 0.85),
        size: rand(1.4, 3.6) * Math.max(0.7, view.scale / 190),
        rot: Math.random() * TAU,
        vrot: rand(-9, 9),
        kind: kind || 'dot',
        color: colors[(Math.random() * colors.length) | 0]
      });
    }
    if (PARTS.length > 420) PARTS.splice(0, PARTS.length - 420);
  }

  // 碎裂：整层炸成扇形碎块
  function shatter(L, big) {
    var cy = layerCY(L.y);
    var Rs = CFG.R * view.scale;
    var Ry = CFG.R * CFG.TILT * view.scale;
    var n = big ? 20 : 14;

    for (var i = 0; i < n; i++) {
      var a = (i / n) * TAU + Math.random() * 0.2;
      PARTS.push({
        x: view.cx + Math.cos(a) * Rs * 0.72,
        y: cy + Math.sin(a) * Ry * 0.72,
        vx: Math.cos(a) * rand(0.9, 2.1) * (view.scale * 0.09) + rand(-1, 1),
        vy: Math.sin(a) * rand(0.5, 1.2) * (view.scale * 0.045) - rand(0.3, 1.4),
        g: 620,
        life: rand(0.55, 0.95),
        size: rand(4, 9) * Math.max(0.7, view.scale / 190),
        rot: a,
        vrot: rand(-7, 7),
        kind: 'shard',
        color: i % 3 === 0 ? '#ff8fa1' : '#c92b45'
      });
    }
    burst(view.cx, cy, 8, ['#ffd0d8', '#ff6b7d'], 2.0, 'dot');
  }

  function updateParts(dt) {
    for (var i = PARTS.length - 1; i >= 0; i--) {
      var p = PARTS[i];
      p.life -= dt;
      if (p.life <= 0) { PARTS.splice(i, 1); continue; }
      p.vy += p.g * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vrot * dt;
      p.vrot *= 0.99;
    }
  }

  function drawParts() {
    for (var i = 0; i < PARTS.length; i++) {
      var p = PARTS[i];
      var al = clamp(p.life / 0.45, 0, 1);
      ctx.globalAlpha = al;
      ctx.fillStyle = p.color;
      if (p.kind === 'shard') {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.beginPath();
        ctx.moveTo(-p.size, -p.size * 0.34);
        ctx.lineTo(p.size * 1.1, -p.size * 0.1);
        ctx.lineTo(p.size * 0.5, p.size * 0.5);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * al, 0, TAU);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  // =====================================================================
  //  背景
  // =====================================================================
  var DUST = [];

  function buildDust() {
    DUST.length = 0;
    var n = clamp(Math.round((view.W * view.H) / 26000), 20, 70);
    for (var i = 0; i < n; i++) {
      DUST.push({
        x: Math.random() * view.W,
        y: Math.random() * view.H,
        r: rand(0.5, 1.7),
        sp: rand(6, 24),
        ph: Math.random() * TAU,
        a: rand(0.05, 0.2)
      });
    }
  }

  function drawBackground() {
    var g = ctx.createRadialGradient(view.cx, view.H * 0.34, 0,
                                     view.cx, view.H * 0.34, Math.max(view.W, view.H) * 0.85);
    g.addColorStop(0, '#1d0a16');
    g.addColorStop(0.45, '#120610');
    g.addColorStop(1, '#07030a');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, view.W, view.H);

    ctx.fillStyle = '#ff9db0';
    for (var i = 0; i < DUST.length; i++) {
      var d = DUST[i];
      var y = (d.y - S.t * d.sp) % (view.H + 40);
      if (y < 0) y += view.H + 40;
      ctx.globalAlpha = d.a * (0.55 + 0.45 * Math.sin(S.t * 1.2 + d.ph));
      ctx.beginPath();
      ctx.arc(d.x, y, d.r, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 中心柱：深色实体，盘就穿在它上面
    var cw = Math.max(3, CFG.INNER * view.scale * 1.05);
    var pg = ctx.createLinearGradient(view.cx - cw, 0, view.cx + cw, 0);
    pg.addColorStop(0, 'rgba(9,3,8,0)');
    pg.addColorStop(0.26, 'rgba(9,3,8,0.62)');
    pg.addColorStop(0.5, 'rgba(26,9,18,0.94)');
    pg.addColorStop(0.74, 'rgba(9,3,8,0.62)');
    pg.addColorStop(1, 'rgba(9,3,8,0)');
    ctx.fillStyle = pg;
    ctx.fillRect(view.cx - cw, 0, cw * 2, view.H);

    // 柱子上的一道细高光，免得整根柱子糊成黑条
    var hl = ctx.createLinearGradient(view.cx - cw * 0.5, 0, view.cx + cw * 0.1, 0);
    hl.addColorStop(0, 'rgba(255,160,190,0)');
    hl.addColorStop(0.7, 'rgba(255,160,190,0.16)');
    hl.addColorStop(1, 'rgba(255,160,190,0)');
    ctx.fillStyle = hl;
    ctx.fillRect(view.cx - cw * 0.5, 0, cw * 0.6, view.H);
  }

  // =====================================================================
  //  画盘
  // =====================================================================
  function ringPath(cy, rx, ry, ix, iy, a0, sweep) {
    ctx.beginPath();
    ctx.ellipse(view.cx, cy, rx, ry, 0, a0, a0 + sweep);
    ctx.ellipse(view.cx, cy, ix, iy, 0, a0 + sweep, a0, true);
    ctx.closePath();
  }

  function drawLayer(L) {
    if (L.broken) return;

    var cy = layerCY(L.y) + L.sink * 2.5;
    var Rs = CFG.R * view.scale;
    var Ry = CFG.R * CFG.TILT * view.scale;
    var iR = CFG.INNER * view.scale;
    var iY = CFG.INNER * CFG.TILT * view.scale;
    var thick = CFG.THICK * view.scale;

    if (cy - Ry > view.H + 60 || cy + Ry + thick < -60) return;

    var a0 = L.gap + S.rot + L.gapW * 0.5;
    var sweep = TAU - L.gapW;

    // 侧面
    ringPath(cy + thick, Rs, Ry, iR, iY, a0, sweep);
    ctx.fillStyle = '#5c0c1c';
    ctx.fill();

    // 顶面
    ringPath(cy, Rs, Ry, iR, iY, a0, sweep);
    var tg = ctx.createRadialGradient(view.cx, cy - Ry * 0.25, iR,
                                      view.cx, cy, Rs * 1.02);
    tg.addColorStop(0, '#ff8fa0');
    tg.addColorStop(0.42, '#ef4f66');
    tg.addColorStop(0.78, '#c92b45');
    tg.addColorStop(1, '#9d1b31');
    ctx.fillStyle = tg;
    ctx.fill();

    // 危险扇区
    if (L.hz.length) {
      ctx.save();
      ringPath(cy, Rs, Ry, iR, iY, a0, sweep);
      ctx.clip();

      for (var n = 0; n < L.hz.length; n++) {
        var h = L.hz[n];
        var hc = h.c + S.rot;
        var h0 = hc - h.w * 0.5;
        var h1 = hc + h.w * 0.5;

        ctx.beginPath();
        ctx.moveTo(view.cx, cy);
        ctx.ellipse(view.cx, cy, Rs, Ry, 0, h0, h1);
        ctx.closePath();
        var hg = ctx.createRadialGradient(view.cx, cy, iR, view.cx, cy, Rs);
        hg.addColorStop(0, '#050001');
        hg.addColorStop(0.62, '#150006');
        hg.addColorStop(1, '#33010c');
        ctx.fillStyle = hg;
        ctx.fill();

        // 外缘锯齿
        ctx.beginPath();
        var steps = Math.max(5, Math.round((h1 - h0) / 0.1) * 2 - 1);
        for (var s = 0; s <= steps; s++) {
          var aa = h0 + (h1 - h0) * (s / steps);
          var rr = (s % 2 === 0) ? 1.0 : 0.82;
          var xx = view.cx + Math.cos(aa) * Rs * rr;
          var yy = cy + Math.sin(aa) * Ry * rr;
          if (s === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
        }
        ctx.strokeStyle = 'rgba(255,58,96,0.95)';
        ctx.lineWidth = Math.max(1.6, view.scale * 0.013);
        ctx.stroke();

        // 两侧边缘亮线
        for (var e2 = 0; e2 < 2; e2++) {
          var ea2 = e2 === 0 ? h0 : h1;
          ctx.beginPath();
          ctx.moveTo(view.cx + Math.cos(ea2) * iR, cy + Math.sin(ea2) * iY);
          ctx.lineTo(view.cx + Math.cos(ea2) * Rs, cy + Math.sin(ea2) * Ry);
          ctx.strokeStyle = 'rgba(255,72,110,0.9)';
          ctx.lineWidth = Math.max(1.6, view.scale * 0.011);
          ctx.stroke();
        }
      }
      ctx.restore();
    }

    // 缺口两侧的切口，让通道一眼看得出
    var edges = [a0, a0 + sweep];
    for (var e = 0; e < 2; e++) {
      var ea = edges[e];
      var cx1 = Math.cos(ea), sy1 = Math.sin(ea);
      ctx.beginPath();
      ctx.moveTo(view.cx + cx1 * iR, cy + sy1 * iY);
      ctx.lineTo(view.cx + cx1 * Rs, cy + sy1 * Ry);
      ctx.lineTo(view.cx + cx1 * Rs, cy + thick + sy1 * Ry);
      ctx.lineTo(view.cx + cx1 * iR, cy + thick + sy1 * iY);
      ctx.closePath();
      ctx.fillStyle = e === 0 ? '#7d1226' : '#5e0d1c';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,248,250,0.85)';
      ctx.lineWidth = Math.max(1.1, view.scale * 0.008);
      ctx.stroke();
    }

    // 外缘高光
    ctx.beginPath();
    ctx.ellipse(view.cx, cy, Rs, Ry, 0, a0, a0 + sweep);
    ctx.strokeStyle = 'rgba(255,190,202,0.34)';
    ctx.lineWidth = Math.max(1, view.scale * 0.008);
    ctx.stroke();

    // 被球压到的瞬时白晕
    if (L.sink > 0.01) {
      ringPath(cy, Rs, Ry, iR, iY, a0, sweep);
      ctx.fillStyle = 'rgba(255,255,255,' + (L.sink * 0.12) + ')';
      ctx.fill();
    }

    // 预警：这一层会要命，整层脉冲红光
    if (L === S.warnLayer && S.warnPulse > 0.01) {
      var pulse = 0.5 + 0.5 * Math.abs(Math.sin(S.t * 7));
      var wa = S.warnPulse * pulse;
      ctx.save();
      ctx.shadowColor = 'rgba(255,32,72,' + wa + ')';
      ctx.shadowBlur = Math.max(12, view.scale * 0.12);
      ringPath(cy, Rs * 1.015, Ry * 1.015, iR, iY, a0, sweep);
      ctx.strokeStyle = 'rgba(255,70,105,' + wa + ')';
      ctx.lineWidth = Math.max(3, view.scale * 0.026);
      ctx.stroke();
      ctx.restore();
    }
  }

  // =====================================================================
  //  画球
  // =====================================================================
  function drawBall() {
    var sx = projX(BALL_A, CFG.ORBIT);
    var sy = projY(BALL_A, CFG.ORBIT, S.ballY);
    var r = CFG.BALL_R * view.scale;

    var sq = S.squash;
    var st = clamp(Math.abs(S.vy) * 0.018, 0, 0.15);
    var rx = r * (1 + sq * 0.26 - st * 0.4);
    var ry = r * (1 - sq * 0.26 + st);
    var hot = S.fireball;

    var glowR = r * (hot ? 3.2 : 2.3);
    var glow = ctx.createRadialGradient(sx, sy, r * 0.6, sx, sy, glowR);
    if (hot) {
      glow.addColorStop(0, 'rgba(255,150,60,0.55)');
      glow.addColorStop(1, 'rgba(255,80,20,0)');
    } else {
      glow.addColorStop(0, 'rgba(110,215,255,0.26)');
      glow.addColorStop(1, 'rgba(110,215,255,0)');
    }
    ctx.beginPath();
    ctx.arc(sx, sy, glowR, 0, TAU);
    ctx.fillStyle = glow;
    ctx.fill();

    var g = ctx.createRadialGradient(sx - rx * 0.34, sy - ry * 0.4, r * 0.06, sx, sy, r * 1.05);
    if (hot) {
      g.addColorStop(0, '#fffdf0');
      g.addColorStop(0.28, '#ffd76a');
      g.addColorStop(0.66, '#ff8b1f');
      g.addColorStop(1, '#c42d00');
    } else {
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.3, '#bdefff');
      g.addColorStop(0.72, '#4bb4e8');
      g.addColorStop(1, '#14608f');
    }
    ctx.beginPath();
    ctx.ellipse(sx, sy, rx, ry, 0, 0, TAU);
    ctx.fillStyle = g;
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(sx - rx * 0.3, sy - ry * 0.36, rx * 0.26, ry * 0.26, 0, 0, TAU);
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(sx, sy, rx, ry, 0, 0, TAU);
    ctx.lineWidth = Math.max(1, r * 0.09);
    ctx.strokeStyle = hot ? 'rgba(255,240,200,0.75)' : 'rgba(255,255,255,0.4)';
    ctx.stroke();

    if (hot) {
      ctx.globalAlpha = 0.45;
      var fg = ctx.createLinearGradient(sx, sy - ry, sx, sy - ry * 3.4);
      fg.addColorStop(0, 'rgba(255,190,80,0.85)');
      fg.addColorStop(1, 'rgba(255,90,20,0)');
      ctx.beginPath();
      ctx.moveTo(sx - rx * 0.75, sy - ry * 0.6);
      ctx.quadraticCurveTo(sx, sy - ry * 4, sx + rx * 0.75, sy - ry * 0.6);
      ctx.closePath();
      ctx.fillStyle = fg;
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  // =====================================================================
  //  渲染
  // =====================================================================
  function draw() {
    var sh = S.shake;
    var ox = 0, oy = 0;
    if (sh > 0.2) {
      ox = rand(-sh, sh) * 0.8;
      oy = rand(-sh, sh) * 0.8;
    }

    ctx.save();
    ctx.translate(ox, oy);

    drawBackground();

    // 从低到高画：高的后画，近的盖远的
    for (var n = S.layers.length - 1; n >= 0; n--) {
      drawLayer(S.layers[n]);
    }

    drawParts();

    if (S.mode !== 'over') drawBall();

    ctx.restore();

    var tg = ctx.createLinearGradient(0, 0, 0, view.H * 0.2);
    tg.addColorStop(0, 'rgba(7,3,10,0.82)');
    tg.addColorStop(1, 'rgba(7,3,10,0)');
    ctx.fillStyle = tg;
    ctx.fillRect(0, 0, view.W, view.H * 0.2);

    var bg = ctx.createLinearGradient(0, view.H, 0, view.H * 0.9);
    bg.addColorStop(0, 'rgba(7,3,10,0.7)');
    bg.addColorStop(1, 'rgba(7,3,10,0)');
    ctx.fillStyle = bg;
    ctx.fillRect(0, view.H * 0.9, view.W, view.H * 0.1);

    // 危险预警：屏幕四边泛红
    if (S.warnPulse > 0.01 && S.mode !== 'over') {
      var pulse2 = 0.4 + 0.6 * Math.abs(Math.sin(S.t * 7));
      var rg = ctx.createRadialGradient(view.cx, view.H * 0.45, Math.min(view.W, view.H) * 0.18,
                                        view.cx, view.H * 0.45, Math.max(view.W, view.H) * 0.72);
      rg.addColorStop(0, 'rgba(255,30,70,0)');
      rg.addColorStop(1, 'rgba(255,30,70,' + (S.warnPulse * pulse2 * 0.4) + ')');
      ctx.fillStyle = rg;
      ctx.fillRect(0, 0, view.W, view.H);
    }
  }

  // =====================================================================
  //  每帧
  // =====================================================================
  function update(dt) {
    S.t += dt;

    if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 34);
    if (S.squash > 0) S.squash = Math.max(0, S.squash - dt * 6);

    updateParts(dt);

    for (var n = 0; n < S.layers.length; n++) {
      var L = S.layers[n];
      if (L.sink > 0.005) L.sink = Math.max(0, L.sink - dt * 5.5);
    }

    if (S.mode === 'over') {
      S.deadT += dt;
      var t2 = S.ballY - 0.05;
      S.camY += (t2 - S.camY) * Math.min(1, dt * 3);
      if (S.deadT > 0.72) showOver();
      return;
    }

    if (S.mode !== 'play') return;

    ensureLayers();

    var spin = 0;
    if (keys.left) spin -= 1;
    if (keys.right) spin += 1;
    if (spin !== 0) {
      S.rot += spin * CFG.SPIN * dt;
      S.rotV = 0;
    } else if (Math.abs(S.rotV) > 0.0008) {
      S.rot += S.rotV * dt;
      S.rotV *= Math.pow(0.0009, dt);
    }

    var prevBottom = S.ballY - CFG.BALL_R;
    S.vy = Math.max(CFG.VMAX, S.vy + CFG.GRAV * dt);
    S.ballY += S.vy * dt;
    var bottom = S.ballY - CFG.BALL_R;

    if (S.vy < 0) collideDown(prevBottom, bottom);

    // 预警：球正下方那层如果会要命，提前亮起来
    S.warnLayer = warnTarget();
    S.warnHot = !!(S.warnLayer && !S.fireball && onHazard(S.warnLayer));
    S.warnPulse = S.warnHot ? Math.min(1, S.warnPulse + dt * 5) : Math.max(0, S.warnPulse - dt * 6);

    var camTarget = S.ballY - 0.05;
    S.camY += (camTarget - S.camY) * Math.min(1, dt * 10);

    if (S.fireball && Math.random() < 0.55) {
      burst(projX(BALL_A, CFG.ORBIT) + rand(-5, 5),
            projY(BALL_A, CFG.ORBIT, S.ballY) + rand(-5, 5),
            1, ['#ffd166', '#ff8b1f'], 0.9, 'dot');
    }
  }

  // =====================================================================
  //  主循环
  // =====================================================================
  var lastT = 0;

  function loop(now) {
    if (!lastT) lastT = now;
    var dt = (now - lastT) / 1000;
    lastT = now;
    dt = Math.min(dt, 0.05);

    update(dt);
    draw();

    requestAnimationFrame(loop);
  }

  // =====================================================================
  //  UI
  // =====================================================================
  function updateHud() {
    elScore.textContent = S.score;
    elDepth.textContent = S.depth;
    elBest.textContent = S.best;
  }

  function floater(text, hot) {
    var d = document.createElement('div');
    d.className = 'floater' + (hot ? ' hot' : '');
    d.textContent = text;
    elFloaters.appendChild(d);
    setTimeout(function () {
      if (d.parentNode) d.parentNode.removeChild(d);
    }, 1050);
  }

  function hidePanels() {
    panelStart.classList.remove('show');
    panelPause.classList.remove('show');
    panelOver.classList.remove('show');
  }

  function showOver() {
    if (panelOver.classList.contains('show')) return;
    ovScore.textContent = S.score;
    ovDepth.textContent = S.depth;
    ovBest.textContent = S.best;
    panelOver.classList.add('show');
  }

  function reset() {
    S.rot = 0;
    S.rotV = 0;
    S.ballY = 1.9;
    S.vy = 0;
    S.camY = S.ballY - 0.05;
    S.layers.length = 0;
    S.nextIdx = 0;
    S.score = 0;
    S.depth = 0;
    S.combo = 0;
    S.fireball = false;
    S.squash = 0;
    S.bounceTick = 0;
    S.shake = 0;
    S.deadT = 0;
    S.warnLayer = null;
    S.warnHot = false;
    S.warnPulse = 0;
    PARTS.length = 0;
    elFloaters.innerHTML = '';
    elNewBest.classList.remove('show');

    ensureLayers();
    updateHud();
  }

  function startGame() {
    reset();
    hidePanels();
    S.mode = 'play';
    sfxBounce(0);
  }

  function togglePause() {
    if (S.mode === 'play') {
      S.mode = 'pause';
      panelPause.classList.add('show');
    } else if (S.mode === 'pause') {
      S.mode = 'play';
      panelPause.classList.remove('show');
    }
  }

  // =====================================================================
  //  输入
  // =====================================================================
  var keys = { left: false, right: false };
  var drag = { active: false, x: 0, lastT: 0 };

  canvas.addEventListener('pointerdown', function (e) {
    if (S.mode !== 'play') return;
    drag.active = true;
    drag.x = e.clientX;
    drag.lastT = performance.now();
    canvas.classList.add('dragging');
  });

  window.addEventListener('pointermove', function (e) {
    if (!drag.active || S.mode !== 'play') return;
    var dx = e.clientX - drag.x;
    drag.x = e.clientX;
    S.rot += dx * CFG.DRAG;

    var now = performance.now();
    var dtm = Math.max(8, now - drag.lastT) / 1000;
    S.rotV = clamp((dx * CFG.DRAG) / dtm, -7, 7);
    drag.lastT = now;
  }, { passive: true });

  function endDrag() {
    if (!drag.active) return;
    drag.active = false;
    canvas.classList.remove('dragging');
    if (performance.now() - drag.lastT > 90) S.rotV *= 0.25;
  }
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);

  document.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { keys.left = true; e.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { keys.right = true; e.preventDefault(); }
    else if (k === ' ' || k === 'Escape' || k === 'p' || k === 'P') {
      e.preventDefault();
      if (S.mode === 'play' || S.mode === 'pause') togglePause();
    } else if (k === 'Enter') {
      if (S.mode === 'ready' || S.mode === 'over') startGame();
    }
  });

  document.addEventListener('keyup', function (e) {
    var k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
    if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
  });

  document.getElementById('btnStart').addEventListener('click', startGame);
  document.getElementById('btnAgain').addEventListener('click', startGame);
  document.getElementById('btnResume').addEventListener('click', togglePause);

  btnPause.addEventListener('click', function () {
    if (S.mode === 'play' || S.mode === 'pause') togglePause();
  });

  btnSound.addEventListener('click', function () {
    S.soundOn = !S.soundOn;
    btnSound.classList.toggle('off', !S.soundOn);
    btnSound.setAttribute('aria-pressed', String(S.soundOn));
    btnSound.setAttribute('aria-label', S.soundOn ? '关闭音效' : '开启音效');
    if (S.soundOn) sfxBounce(0);
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && S.mode === 'play') togglePause();
  });

  // =====================================================================
  //  尺寸
  // =====================================================================
  function resize() {
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    var W = window.innerWidth;
    var H = window.innerHeight;

    view.W = W;
    view.H = H;
    view.dpr = dpr;
    view.cx = W / 2;
    view.baseY = H * 0.40;

    var hLimit = (W > H * 1.15) ? H * 0.30 : H * 0.25;
    view.scale = Math.min(W * 0.38, hLimit);

    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    buildDust();
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () {
    setTimeout(resize, 120);
  });

  // =====================================================================
  //  启动
  // =====================================================================
  try {
    var saved = localStorage.getItem('helix-drop-best') || localStorage.getItem('helix-jump-best');
    if (saved) S.best = parseInt(saved, 10) || 0;
  } catch (e) {}

  resize();
  S.camY = S.ballY - 0.05;
  ensureLayers();
  updateHud();

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
